name: Publish package

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify tag matches package versions
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          cli_version=$(node -p "require('./packages/cli/package.json').version")
          herdr_version=$(node -p "require('./packages/extensions/herdr/package.json').version")
          subagents_version=$(node -p "require('./packages/extensions/subagents/package.json').version")
          root_version=$(node -p "require('./package.json').version")
          if [ "$version" != "$root_version" ] || [ "$version" != "$cli_version" ] || [ "$version" != "$herdr_version" ] || [ "$version" != "$subagents_version" ]; then
            echo "Package versions differ: root=$root_version core=$version cli=$cli_version herdr=$herdr_version subagents=$subagents_version" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Inspect package contents
        run: |
          npm pack --dry-run --json --workspace=packages/core
          npm pack --dry-run --json --workspace=packages/cli
          npm pack --dry-run --json --workspace=packages/extensions/herdr
          npm pack --dry-run --json --workspace=packages/extensions/subagents
      - name: Publish core package
        run: npm publish --access public
        working-directory: packages/core
      - name: Publish CLI package
        run: npm publish --access public
        working-directory: packages/cli
      - name: Publish Herdr package
        run: npm publish --access public
        working-directory: packages/extensions/herdr
      - name: Publish Subagents package
        run: npm publish --access public
        working-directory: packages/extensions/subagents
